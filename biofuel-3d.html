<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biofuel Production: How Ethanol Is Made — 3D Interactive Process</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #0b1220; color: #e2e8f0; overflow: hidden; }
    #canvas-wrap { position: fixed; inset: 0; }
    .hud-top {
      position: fixed; top: 14px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 10;
    }
    .title-card {
      pointer-events: auto; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px);
      border: 1px solid #334155; border-radius: 12px; padding: 10px 16px;
    }
    .title-card h1 { font-size: 15px; font-weight: 700; color: #f8fafc; }
    .title-card p { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    .controls {
      pointer-events: auto; display: flex; gap: 8px; align-items: center;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px);
      border: 1px solid #334155; border-radius: 12px; padding: 8px 12px;
    }
    button {
      background: #1e293b; color: #e2e8f0; border: 1px solid #475569; border-radius: 8px;
      padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.15s;
    }
    button:hover { background: #334155; }
    button.primary { background: #2563eb; border-color: #3b82f6; color: #fff; }
    button.primary:hover { background: #1d4ed8; }
    .info-panel {
      position: fixed; bottom: 16px; left: 16px; width: 380px; max-width: calc(100vw - 32px);
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px);
      border: 1px solid #334155; border-radius: 14px; padding: 14px 16px; z-index: 10;
    }
    .step-badge {
      display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase;
      padding: 2px 8px; border-radius: 999px; background: #1d4ed8; color: #fff; margin-bottom: 6px;
    }
    .info-panel h2 { font-size: 16px; color: #f8fafc; margin-bottom: 6px; }
    .info-panel .desc { font-size: 13px; color: #cbd5e1; line-height: 1.45; margin-bottom: 10px; }
    .vocab-box {
      background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 8px 10px;
      font-size: 12px; line-height: 1.5;
    }
    .vocab-box b { color: #38bdf8; }
    .steps-bar {
      position: fixed; bottom: 16px; right: 16px; display: flex; flex-wrap: wrap; gap: 6px;
      max-width: 340px; justify-content: flex-end; z-index: 10;
    }
    .step-pill {
      padding: 5px 10px; border-radius: 999px; font-size: 11px; font-weight: 600;
      background: rgba(30, 41, 59, 0.85); border: 1px solid #334155; color: #94a3b8; cursor: pointer;
    }
    .step-pill.active { background: #10b981; border-color: #34d399; color: #052e16; }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>

  <div class="hud-top">
    <div class="title-card">
      <h1>Cam 19 Test 3 — Biofuel Production: How Ethanol Is Made</h1>
      <p>Drag to rotate 360° • Scroll to zoom • Click any stage or use Play</p>
    </div>
    <div class="controls">
      <button id="btn-prev">← Prev</button>
      <button id="btn-play" class="primary">▶ Play</button>
      <button id="btn-next">Next →</button>
    </div>
  </div>

  <div class="info-panel">
    <span class="step-badge" id="step-badge">Step 1 / 9</span>
    <h2 id="step-title"></h2>
    <div class="desc" id="step-desc"></div>
    <div class="vocab-box" id="step-vocab"></div>
  </div>

  <div class="steps-bar" id="steps-bar"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const STEPS = [
      {
        title: '1. Energy & Plant Growth',
        desc: 'Plants and trees absorb sunlight and carbon dioxide (CO₂) from the atmosphere to grow.',
        vocab: '<b>Verbs:</b> absorb, photosynthesize, grow<br><b>Sample:</b> <i>Initially, plants and trees grow by absorbing energy from sunlight and carbon dioxide.</i>',
        color: 0x22c55e,
        angle: 0,
      },
      {
        title: '2. Harvesting',
        desc: 'Once mature, the plants and crops are harvested using agricultural machinery.',
        vocab: '<b>Verbs:</b> are harvested, are gathered, are collected<br><b>Sample:</b> <i>Once fully grown, the vegetation is harvested by farm machinery.</i>',
        color: 0x84cc16,
        angle: (Math.PI * 2 * 1) / 9,
      },
      {
        title: '3. Pre-processing',
        desc: 'The harvested plant material is fed into a pre-processing machine to be shredded into smaller pieces.',
        vocab: '<b>Verbs:</b> are pre-processed, are shredded, are broken down<br><b>Sample:</b> <i>Subsequently, the harvested crops undergo pre-processing, where they are shredded.</i>',
        color: 0xeab308,
        angle: (Math.PI * 2 * 2) / 9,
      },
      {
        title: '4. Cellulose Extraction',
        desc: 'Pre-processing yields cellulose fibers from the broken-down plant matter.',
        vocab: '<b>Verbs:</b> is extracted, is obtained, is separated<br><b>Sample:</b> <i>This stage produces cellulose, which is then transferred for chemical treatment.</i>',
        color: 0x10b981,
        angle: (Math.PI * 2 * 3) / 9,
      },
      {
        title: '5. Chemical Processing',
        desc: 'The cellulose is processed in a laboratory/factory using chemicals to break it down.',
        vocab: '<b>Verbs:</b> is processed, is treated chemically, is converted<br><b>Sample:</b> <i>Next, the cellulose is chemically processed in order to extract sugars.</i>',
        color: 0x06b6d4,
        angle: (Math.PI * 2 * 4) / 9,
      },
      {
        title: '6. Sugars Formation',
        desc: 'Chemical processing converts the cellulose into simple sugar molecules.',
        vocab: '<b>Verbs:</b> is converted into, yields, forms<br><b>Sample:</b> <i>As a result of processing, sugars are formed.</i>',
        color: 0x3b82f6,
        angle: (Math.PI * 2 * 5) / 9,
      },
      {
        title: '7. Microbes Added (Fermentation)',
        desc: 'Microbes are added to the sugars to ferment them into ethanol.',
        vocab: '<b>Verbs:</b> are added to, ferment, react with<br><b>Sample:</b> <i>Microbes are then added to the sugars to trigger fermentation.</i>',
        color: 0x8b5cf6,
        angle: (Math.PI * 2 * 6) / 9,
      },
      {
        title: '8. Ethanol Production',
        desc: 'Pure ethanol biofuel is produced and stored for distribution.',
        vocab: '<b>Verbs:</b> is produced, is generated, is refined<br><b>Sample:</b> <i>Following fermentation, ethanol fuel is produced.</i>',
        color: 0xf59e0b,
        angle: (Math.PI * 2 * 7) / 9,
      },
      {
        title: '9. Fuel Usage & CO₂ Cycle',
        desc: 'Ethanol powers cars, trucks, and planes, releasing CO₂ back into the air for plants to reuse.',
        vocab: '<b>Verbs:</b> powers, is consumed by, is released, cycles back<br><b>Sample:</b> <i>Finally, ethanol powers vehicles, releasing CO₂ that is reabsorbed by plants, completing the cycle.</i>',
        color: 0xef4444,
        angle: (Math.PI * 2 * 8) / 9,
      },
    ];

    const wrap = document.getElementById('canvas-wrap');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1220);
    scene.fog = new THREE.FogExp2(0x0b1220, 0.022);

    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 12, 17);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    wrap.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;

    scene.add(new THREE.AmbientLight(0xffffff, 0.75));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.3);
    dirLight.position.set(8, 16, 10);
    scene.add(dirLight);

    // Base ring
    const R = 7.2;
    const ringGeo = new THREE.TorusGeometry(R, 0.12, 16, 100);
    const ringMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.4, roughness: 0.5 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2;
    scene.add(ring);

    // Grid floor
    const grid = new THREE.GridHelper(28, 28, 0x1e293b, 0x111827);
    grid.position.y = -0.8;
    scene.add(grid);

    // Build 9 stage nodes
    const stageMeshes = [];
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    STEPS.forEach((s, idx) => {
      const group = new THREE.Group();
      const x = Math.sin(s.angle) * R;
      const z = -Math.cos(s.angle) * R;
      group.position.set(x, 0, z);

      // Pedestal
      const ped = new THREE.Mesh(
        new THREE.CylinderGeometry(1.05, 1.2, 0.4, 24),
        new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 })
      );
      ped.position.y = -0.2;
      group.add(ped);

      // Distinct 3D icon per stage
      const mat = new THREE.MeshStandardMaterial({ color: s.color, roughness: 0.35, metalness: 0.2 });
      let icon;
      if (idx === 0) {
        icon = new THREE.Mesh(new THREE.ConeGeometry(0.65, 1.5, 12), mat);
        icon.position.y = 0.85;
      } else if (idx === 1 || idx === 8) {
        icon = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.7, 0.8), mat);
        icon.position.y = 0.5;
      } else if (idx === 2 || idx === 4) {
        icon = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 1.2, 16), mat);
        icon.position.y = 0.7;
      } else if (idx === 3 || idx === 5) {
        icon = new THREE.Mesh(new THREE.TorusKnotGeometry(0.45, 0.14, 48, 8), mat);
        icon.position.y = 0.85;
      } else {
        icon = new THREE.Mesh(new THREE.IcosahedronGeometry(0.62, 1), mat);
        icon.position.y = 0.8;
      }
      icon.userData = { stepIdx: idx };
      group.add(icon);
      stageMeshes.push({ group, icon, ped, color: s.color });
      scene.add(group);
    });

    // Moving particle along the cycle
    const orb = new THREE.Mesh(
      new THREE.SphereGeometry(0.28, 16, 16),
      new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 1.5 })
    );
    scene.add(orb);

    let currentStep = 0;
    let playing = false;
    let orbAngle = 0;

    const stepsBar = document.getElementById('steps-bar');
    STEPS.forEach((s, i) => {
      const pill = document.createElement('button');
      pill.className = 'step-pill';
      pill.textContent = `${i + 1}`;
      pill.title = s.title;
      pill.onclick = () => { playing = false; updatePlayBtn(); selectStep(i); };
      stepsBar.appendChild(pill);
    });

    function selectStep(idx) {
      currentStep = (idx + STEPS.length) % STEPS.length;
      const s = STEPS[currentStep];
      orbAngle = s.angle;
      document.getElementById('step-badge').textContent = `Step ${currentStep + 1} / ${STEPS.length}`;
      document.getElementById('step-title').textContent = s.title;
      document.getElementById('step-desc').textContent = s.desc;
      document.getElementById('step-vocab').innerHTML = s.vocab;
      [...stepsBar.children].forEach((el, i) => el.classList.toggle('active', i === currentStep));
      stageMeshes.forEach((m, i) => {
        m.ped.material.emissive.setHex(i === currentStep ? m.color : 0x000000);
        m.ped.material.emissiveIntensity = i === currentStep ? 0.45 : 0;
      });
    }

    function updatePlayBtn() {
      document.getElementById('btn-play').textContent = playing ? '⏸ Pause' : '▶ Play';
    }

    document.getElementById('btn-prev').onclick = () => { playing = false; updatePlayBtn(); selectStep(currentStep - 1); };
    document.getElementById('btn-next').onclick = () => { playing = false; updatePlayBtn(); selectStep(currentStep + 1); };
    document.getElementById('btn-play').onclick = () => { playing = !playing; updatePlayBtn(); };

    window.addEventListener('click', (e) => {
      if (e.target.closest('button') || e.target.closest('.info-panel')) return;
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(stageMeshes.map(m => m.icon));
      if (hits.length) {
        playing = false;
        updatePlayBtn();
        selectStep(hits[0].object.userData.stepIdx);
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    selectStep(0);

    function animate() {
      requestAnimationFrame(animate);
      if (playing) {
        orbAngle += 0.006;
        if (orbAngle >= Math.PI * 2) orbAngle -= Math.PI * 2;
        const nearest = Math.floor((orbAngle / (Math.PI * 2)) * STEPS.length) % STEPS.length;
        if (nearest !== currentStep) selectStep(nearest);
      }
      orb.position.set(Math.sin(orbAngle) * R, 0.55, -Math.cos(orbAngle) * R);
      stageMeshes.forEach((m, i) => {
        m.icon.rotation.y += i === currentStep ? 0.025 : 0.006;
      });
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
