<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IELTS Writing Task 1 — 3D Interactive Map</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #0b1220; color: #e2e8f0; overflow: hidden; }
    #canvas-wrap { position: fixed; inset: 0; }
    .hud-top { position: fixed; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 10; gap: 8px; }
    .title-card, .controls { pointer-events: auto; background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(10px); border: 1px solid #334155; border-radius: 10px; padding: 8px 12px; }
    .title-card h1 { font-size: 13px; font-weight: 700; color: #f8fafc; }
    .title-card p { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .controls { display: flex; gap: 6px; align-items: center; padding: 6px 10px; }
    button { background: #1e293b; color: #e2e8f0; border: 1px solid #475569; border-radius: 7px; padding: 5px 12px; font-size: 11px; font-weight: 600; cursor: pointer; }
    button:hover { background: #334155; }
    button.active { background: #2563eb; border-color: #3b82f6; color: #fff; }
    .info-panel { position: fixed; bottom: 12px; left: 12px; width: 360px; max-width: calc(100vw - 24px); max-height: 46vh; overflow: auto; background: rgba(15, 23, 42, 0.93); backdrop-filter: blur(12px); border: 1px solid #334155; border-radius: 12px; padding: 10px 12px; z-index: 10; }
    .badge { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: #10b981; color: #052e16; margin-bottom: 4px; }
    .info-panel h2 { font-size: 14px; color: #f8fafc; margin-bottom: 4px; }
    .info-panel .desc { font-size: 12px; color: #cbd5e1; line-height: 1.4; margin-bottom: 6px; }
    .info-panel ul { padding-left: 16px; font-size: 11.5px; line-height: 1.5; color: #cbd5e1; }
    .vocab-box { margin-top: 6px; background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 7px 9px; font-size: 11px; line-height: 1.45; }
    .vocab-box b { color: #38bdf8; }
    .legend { position: fixed; bottom: 12px; right: 12px; min-width: 150px; background: rgba(15, 23, 42, 0.93); border: 1px solid #334155; border-radius: 10px; padding: 8px 12px; z-index: 10; font-size: 12px; }
    .legend h3 { font-size: 11px; text-transform: uppercase; color: #94a3b8; margin-bottom: 4px; }
    .legend div { display: flex; gap: 8px; align-items: center; line-height: 1.7; }
    .legend span.sym { display: inline-block; min-width: 22px; text-align: center; font-weight: 700; color: #fde047; }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <div class="hud-top">
    <div class="title-card">
      <h1 id="map-title">3D Map</h1>
      <p>Drag to rotate • Scroll to zoom • Switch the two maps • Click any feature</p>
    </div>
    <div class="controls">
      <button id="btn-before" class="active">Before</button>
      <button id="btn-after">After</button>
    </div>
  </div>
  <div class="info-panel">
    <span class="badge" id="state-badge">Before</span>
    <h2 id="item-title">Overview</h2>
    <div class="desc" id="item-desc"></div>
    <ul id="item-changes"></ul>
    <div class="vocab-box" id="item-vocab"></div>
  </div>
  <div class="legend" id="legend"></div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
  </script>
  <script type="module">
    import * as THREE from 'three';

    // ---------- item builders (coordinates are PIXELS read from the book figure) ----------
    const R   = (label, x1, y1, x2, y2, color, h = 0.6, o = {}) => ({ k: 'R', label, x1, y1, x2, y2, color, h, ...o });
    const F   = (label, x1, y1, x2, y2, color, o = {}) => ({ k: 'R', label, x1, y1, x2, y2, color, h: 0.07, ...o });
    const P   = (label, pts, color, h = 0.07, o = {}) => ({ k: 'P', label, pts, color, h, ...o });
    const RD  = (pts, w, label, color = 0x1f2937) => ({ k: 'RD', pts, w, label, color });
    const DOT = (pts, color = 0xffffff, step = 0.24) => ({ k: 'DOT', pts, color, step });
    const T   = (x, y) => ({ k: 'T', x, y });
    const HUT = (x, y) => ({ k: 'HUT', x, y });
    const BOAT = (x, y, rot = 0, color = 0xe2e8f0) => ({ k: 'BOAT', x, y, rot, color });
    const ICON = (g, x, y, desc) => ({ k: 'ICON', g, x, y, desc });
    const GATE = (n, x, y) => ({ k: 'GATE', n, x, y });
    const TXT = (label, x, y) => ({ k: 'TXT', label, x, y });
    const OCT = (label, x, y, r, color, h = 1.2) => ({ k: 'OCT', label, x, y, r, color, h });
    const RA  = (x, y, r) => ({ k: 'RA', x, y, r });
    const TBL = (x, y, round = false) => ({ k: 'TBL', x, y, round });
    const ELL = (label, x, y, rx, rz, color, h = 0.08) => ({ k: 'ELL', label, x, y, rx, rz, color, h });
    const SCALE = (x, y, len, text) => ({ k: 'SCALE', x, y, len, text });
    const rr = (x1, y1, x2, y2, r, n = 8) => {
      const pts = []; const arc = (cx, cy, a0) => { for (let i = 0; i <= n; i++) { const a = a0 + (i / n) * Math.PI / 2; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); } };
      arc(x2 - r, y1 + r, -Math.PI / 2); arc(x2 - r, y2 - r, 0); arc(x1 + r, y2 - r, Math.PI / 2); arc(x1 + r, y1 + r, Math.PI); pts.push(pts[0]); return pts;
    };

      lg.style.display = st.legend && st.legend.length ? 'block' : 'none';
      lg.innerHTML = '<h3>Key</h3>' + (st.legend || []).map(([sym, t]) => `<div><span class="sym">${sym}</span>${t}</div>`).join('');

      const dist = Math.max(gw, gd) * 1.05 + 4;
      camera.position.set(0, dist * 0.85, dist * 0.7);
      controls.target.set(0, 0, 0); controls.update();
    }

    document.getElementById('btn-before').onclick = () => build('before');
    document.getElementById('btn-after').onclick = () => build('after');

    const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
    window.addEventListener('click', (e) => {
      if (e.target.closest('button') || e.target.closest('.info-panel') || e.target.closest('.legend')) return;
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1; pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(clickable, true);
      if (hits.length) {
        let o = hits[0].object; while (o && !(o.userData && o.userData.label)) o = o.parent;
        if (o) { document.getElementById('item-title').textContent = o.userData.label; document.getElementById('item-desc').textContent = o.userData.desc || o.userData.label; }
      }
    });
    window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

    build('before');
    (function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); })();
  </script>
</body>
</html>
