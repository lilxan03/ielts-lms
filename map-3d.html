<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IELTS Writing Task 1 — 3D Interactive Map</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #0b1220; color: #e2e8f0; overflow: hidden; }
    #canvas-wrap { position: fixed; inset: 0; }
    .hud-top { position: fixed; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 10; gap: 8px; }
    .title-card, .controls { pointer-events: auto; background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(10px); border: 1px solid #334155; border-radius: 10px; padding: 8px 12px; }
    .title-card h1 { font-size: 13px; font-weight: 700; color: #f8fafc; }
    .title-card p { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .controls { display: flex; gap: 6px; align-items: center; padding: 6px 10px; }
    button { background: #1e293b; color: #e2e8f0; border: 1px solid #475569; border-radius: 7px; padding: 5px 10px; font-size: 11px; font-weight: 600; cursor: pointer; transition: 0.15s; }
    button:hover { background: #334155; }
    button.active { background: #2563eb; border-color: #3b82f6; color: #fff; }
    .info-panel { position: fixed; bottom: 12px; left: 12px; width: 340px; max-width: calc(100vw - 24px); background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(12px); border: 1px solid #334155; border-radius: 12px; padding: 10px 12px; z-index: 10; }
    .badge { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: #10b981; color: #052e16; margin-bottom: 4px; }
    .info-panel h2 { font-size: 14px; color: #f8fafc; margin-bottom: 4px; }
    .info-panel .desc { font-size: 12px; color: #cbd5e1; line-height: 1.4; margin-bottom: 8px; }
    .vocab-box { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 7px 9px; font-size: 11px; line-height: 1.45; }
    .vocab-box b { color: #38bdf8; }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <div class="hud-top">
    <div class="title-card">
      <h1 id="map-title">3D Map</h1>
      <p>Drag to rotate • Scroll to zoom • Toggle Before / After & click landmarks</p>
    </div>
    <div class="controls">
      <button id="btn-before" class="active">Before</button>
      <button id="btn-after">After</button>
    </div>
  </div>
  <div class="info-panel">
    <span class="badge" id="state-badge">Before</span>
    <h2 id="item-title">Overview</h2>
    <div class="desc" id="item-desc"></div>
    <div class="vocab-box" id="item-vocab"></div>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const MAPS = {
      'cam9-t1': {
        title: 'Cam 9 Test 1 — Tourist Island (Before & After)',
        beforeLabel: 'Before Construction', afterLabel: 'After Construction',
        groundColor: 0x15803d, surroundColor: 0x0284c7,
        vocab: '<b>Key Verbs:</b> was constructed, was transformed into, remained untouched<br><b>Sample:</b> <i>The formerly uninhabited island was developed with accommodation huts, a reception, and a pier.</i>',
        before: [
          { label: 'Beach (West)', pos: [-6.5, 0.1, 0], size: [1.8, 0.2, 5], color: 0xfde047, desc: 'Sandy beach on the western coast.' },
          { label: 'Palm Trees', pos: [-2, 0.8, -2], size: [1.2, 1.6, 1.2], color: 0x22c55e, desc: 'Scattered trees across the island.' },
          { label: 'Palm Trees (East)', pos: [4, 0.8, 1.5], size: [1.2, 1.6, 1.2], color: 0x22c55e, desc: 'Natural woodland on the eastern side.' },
        ],
        after: [
          { label: 'Swimming Beach', pos: [-6.5, 0.1, 0], size: [1.8, 0.2, 5], color: 0xfde047, desc: 'Designated swimming area at the western beach.' },
          { label: 'West Huts', pos: [-3.5, 0.6, 0], size: [2.2, 1.0, 2.5], color: 0xf97316, desc: 'Circular accommodation huts linked by footpaths.' },
          { label: 'Reception', pos: [0, 0.7, 0], size: [1.8, 1.3, 1.6], color: 0x3b82f6, desc: 'Central reception building along the vehicle track.' },
          { label: 'Restaurant', pos: [0, 0.8, -3.5], size: [2.2, 1.4, 1.6], color: 0xef4444, desc: 'New restaurant built north of reception.' },
          { label: 'Pier & Boats', pos: [0, 0.2, 6.2], size: [1.0, 0.3, 3.2], color: 0x94a3b8, desc: 'Pier extended into the southern sea for boats.' },
          { label: 'East Huts', pos: [3.8, 0.6, 0], size: [2.4, 1.0, 2.8], color: 0xf97316, desc: 'Additional accommodation huts in the east.' },
        ]
      },
      'cam12-t2': {
        title: 'Cam 12 Test 2 — Islip Town Centre (Now vs Planned)',
        beforeLabel: 'Now', afterLabel: 'Planned Development',
        groundColor: 0x334155, surroundColor: 0x15803d,
        vocab: '<b>Key Verbs:</b> will be pedestrianised, will be encircled by a dual carriageway<br><b>Sample:</b> <i>The main road is set to become pedestrian-only, encircled by a dual carriageway.</i>',
        before: [
          { label: 'Main Road (E–W)', pos: [0, 0.08, 0], size: [14, 0.12, 1.4], color: 0x1e293b, desc: 'Busy two-way main road running through the centre.' },
          { label: 'Shops (North)', pos: [-1, 0.7, -2.5], size: [8, 1.2, 1.8], color: 0x3b82f6, desc: 'Row of shops north of the main road.' },
          { label: 'Shops (South)', pos: [-1, 0.7, 2.5], size: [8, 1.2, 1.8], color: 0x3b82f6, desc: 'Row of shops south of the main road.' },
          { label: 'Countryside (North)', pos: [0, 0.2, -5.8], size: [12, 0.3, 2.5], color: 0x22c55e, desc: 'Open countryside to the north.' },
          { label: 'School (SW)', pos: [-5.5, 0.8, 5.2], size: [2.2, 1.4, 2.0], color: 0xf59e0b, desc: 'School in the south-west.' },
          { label: 'Park (SE)', pos: [4.5, 0.2, 5.0], size: [3.5, 0.3, 2.8], color: 0x16a34a, desc: 'Public park in the south-east.' },
        ],
        after: [
          { label: 'Pedestrianised Street', pos: [0, 0.08, 0], size: [10, 0.12, 1.6], color: 0xfde047, desc: 'Central main road converted into a pedestrian-only zone.' },
          { label: 'Dual Carriageway', pos: [0, 0.06, -5.5], size: [14, 0.1, 1.2], color: 0x0f172a, desc: 'New ring road (dual carriageway) encircling the centre.' },
          { label: 'Bus Station & Shopping', pos: [-1.5, 0.7, -2.5], size: [7, 1.3, 1.8], color: 0x06b6d4, desc: 'North shops replaced by bus station, shopping centre & car park.' },
          { label: 'New Housing', pos: [4.2, 0.7, -2.5], size: [2.8, 1.2, 1.8], color: 0xf97316, desc: 'New housing built on the north-east side.' },
          { label: 'School (SW)', pos: [-5.5, 0.8, 5.2], size: [2.2, 1.4, 2.0], color: 0xf59e0b, desc: 'School remains in the south-west.' },
          { label: 'Smaller Park (SE)', pos: [4.5, 0.2, 5.0], size: [2.2, 0.3, 2.0], color: 0x16a34a, desc: 'Park reduced slightly to make room for new housing.' },
        ]
      },
      'cam13-t1': {
        title: 'Cam 13 Test 1 — City Hospital Road Access (2007 vs 2010)',
        beforeLabel: '2007', afterLabel: '2010',
        groundColor: 0x1e293b, surroundColor: 0x0f172a,
        vocab: '<b>Key Verbs:</b> were added, was expanded into, was relocated to<br><b>Sample:</b> <i>Two roundabouts were constructed at the intersections, while public parking was moved east.</i>',
        before: [
          { label: 'City Hospital', pos: [0, 1.2, -3.5], size: [4.5, 2.2, 3.0], color: 0xe2e8f0, desc: 'Main City Hospital building surrounded by Ring Road.' },
          { label: 'Car Park (Staff & Public)', pos: [4.0, 0.15, 0.5], size: [2.6, 0.2, 2.6], color: 0x3b82f6, desc: 'Shared staff and public car park east of Hospital Road.' },
          { label: 'Hospital Road', pos: [0, 0.08, 1.5], size: [1.4, 0.1, 6.0], color: 0x475569, desc: 'Main access road with bus stops along both sides.' },
          { label: 'City Road (E–W)', pos: [0, 0.08, 5.2], size: [14, 0.1, 1.4], color: 0x475569, desc: 'Southern City Road.' },
        ],
        after: [
          { label: 'City Hospital', pos: [0, 1.2, -3.5], size: [4.5, 2.2, 3.0], color: 0xe2e8f0, desc: 'City Hospital unchanged in the north.' },
          { label: 'Staff Car Park', pos: [4.0, 0.15, 0.5], size: [2.6, 0.2, 2.6], color: 0x2563eb, desc: 'Former shared car park dedicated solely to staff.' },
          { label: 'Public Car Park (New)', pos: [5.5, 0.15, -3.5], size: [2.8, 0.2, 2.8], color: 0x10b981, desc: 'New public car park constructed east of the hospital.' },
          { label: 'Bus Station (West)', pos: [-4.2, 0.5, 2.0], size: [2.6, 0.9, 2.2], color: 0xf59e0b, desc: 'New bus station built west of Hospital Road.' },
          { label: '2 Roundabouts', pos: [0, 0.25, 4.8], size: [2.0, 0.35, 2.0], color: 0xef4444, desc: 'Two new roundabouts added at Hospital Road junctions.' },
        ]
      },
      'cam13-t4': {
        title: 'Cam 13 Test 4 — University Sports Centre (Now vs Future)',
        beforeLabel: 'Now', afterLabel: 'After Redevelopment',
        groundColor: 0x1e293b, surroundColor: 0x0f172a,
        vocab: '<b>Key Verbs:</b> will be knocked down, will be replaced by, will be extended<br><b>Sample:</b> <i>Both outdoor courts will be replaced by a leisure pool and a sports hall.</i>',
        before: [
          { label: '25m Pool & Gym', pos: [0, 0.8, 0], size: [4.5, 1.5, 4.5], color: 0x06b6d4, desc: 'Central 25m pool, gym, seating & changing room.' },
          { label: 'Outdoor Courts (West)', pos: [-5.5, 0.12, 0], size: [3.2, 0.18, 4.5], color: 0x22c55e, desc: 'Outdoor courts on the western side.' },
          { label: 'Outdoor Courts (East)', pos: [5.5, 0.12, 0], size: [3.2, 0.18, 4.5], color: 0x22c55e, desc: 'Outdoor courts on the eastern side.' },
        ],
        after: [
          { label: '25m Pool & Larger Gym', pos: [0, 0.9, 0], size: [4.5, 1.7, 5.2], color: 0x06b6d4, desc: 'Central pool retained; gym extended northward.' },
          { label: 'Leisure Pool (West)', pos: [-5.5, 0.7, 0], size: [3.6, 1.3, 5.0], color: 0x3b82f6, desc: 'Western outdoor courts replaced by indoor leisure pool.' },
          { label: 'Sports Hall & Studios (East)', pos: [5.5, 0.8, 0], size: [3.6, 1.5, 5.0], color: 0xf97316, desc: 'Eastern courts replaced by sports hall, dance studios & café.' },
        ]
      },
      'cam16-t3': {
        title: 'Cam 16 Test 3 — Airport Redevelopment (Now vs Next Year)',
        beforeLabel: 'Now', afterLabel: 'Next Year',
        groundColor: 0x1e293b, surroundColor: 0x0f172a,
        vocab: '<b>Key Verbs:</b> will be expanded, will be doubled in number, will be introduced<br><b>Sample:</b> <i>The number of gates will more than double from 8 to 18 along a new Y-shaped concourse.</i>',
        before: [
          { label: 'Check-in & Security', pos: [0, 0.7, 2.5], size: [7.5, 1.2, 3.0], color: 0x3b82f6, desc: 'Main terminal with check-in (west) and café (east).' },
          { label: '8 Gates (Walkway)', pos: [0, 0.5, -2.5], size: [6.0, 0.9, 1.8], color: 0x94a3b8, desc: 'Single straight concourse with 8 boarding gates.' },
        ],
        after: [
          { label: 'Expanded Terminal + Sky Train', pos: [0, 0.8, 2.5], size: [9.5, 1.4, 3.6], color: 0x2563eb, desc: 'Expanded terminal with bag drop, shops & sky train.' },
          { label: 'Y-shaped Concourse (18 Gates)', pos: [0, 0.6, -3.0], size: [10.0, 1.1, 3.5], color: 0xf59e0b, desc: 'New Y-shaped concourse expanding capacity to 18 gates.' },
        ]
      },
      'cam19-t2': {
        title: 'Cam 19 Test 2 — Harbour (2000 vs Today)',
        beforeLabel: '2000', afterLabel: 'Today',
        groundColor: 0x334155, surroundColor: 0x0284c7,
        vocab: '<b>Key Verbs:</b> has been converted into, has been added, has been relocated<br><b>Sample:</b> <i>The disused castle in the south-east was converted into a hotel, and a new marina was added.</i>',
        before: [
          { label: 'Fishing Boats', pos: [-4, 0.2, 0], size: [2.5, 0.3, 2.5], color: 0x38bdf8, desc: 'Berth for fishing boats on the west.' },
          { label: 'Public Beach (NE)', pos: [4.5, 0.1, -3.5], size: [3.2, 0.2, 2.2], color: 0xfde047, desc: 'Public beach in the north-east.' },
          { label: 'Disused Castle (SE)', pos: [4.5, 1.1, 3.5], size: [2.6, 2.0, 2.4], color: 0x64748b, desc: 'Disused castle on the south-eastern headland.' },
        ],
        after: [
          { label: 'Marina & Yachts', pos: [-4, 0.2, 0], size: [3.0, 0.3, 3.2], color: 0x0ea5e9, desc: 'Expanded marina for private yachts.' },
          { label: 'Cafes & Shops', pos: [-2, 0.7, -3.5], size: [4.0, 1.2, 1.8], color: 0xf97316, desc: 'New cafes and shops along the northern road.' },
          { label: 'Hotel (ex-Castle)', pos: [4.5, 1.2, 3.5], size: [2.8, 2.2, 2.6], color: 0xef4444, desc: 'Disused castle converted into a luxury hotel with private beach.' },
        ]
      },
      'cam21-t2': {
        title: 'Cam 21 Test 2 — College Café (Before vs Now)',
        beforeLabel: 'Before Redesign', afterLabel: 'Now',
        groundColor: 0x334155, surroundColor: 0x0f172a,
        vocab: '<b>Key Verbs:</b> was replaced by, was moved to, was installed<br><b>Sample:</b> <i>The counter was relocated and a new seating area with sofa booths was introduced.</i>',
        before: [
          { label: 'Serving Counter (North)', pos: [0, 0.6, -4], size: [6.0, 1.1, 1.4], color: 0xf59e0b, desc: 'Long serving counter along the north wall.' },
          { label: 'Square Tables', pos: [0, 0.4, 0.5], size: [5.5, 0.7, 4.5], color: 0x94a3b8, desc: 'Uniform square tables in the centre.' },
          { label: 'Vending Machine', pos: [5, 0.8, -3], size: [1.2, 1.5, 1.2], color: 0xef4444, desc: 'Old vending machine in the north-east.' },
        ],
        after: [
          { label: 'Self-Service & Counter (West)', pos: [-4.5, 0.6, 0], size: [1.8, 1.1, 6.0], color: 0x3b82f6, desc: 'Relocated serving counter and self-service bar on the west.' },
          { label: 'Sofa Booths & Round Tables', pos: [1, 0.5, 0], size: [5.5, 0.8, 5.0], color: 0x10b981, desc: 'Mix of round tables and comfortable sofa booths.' },
          { label: 'Coffee Bar & Study Nook', pos: [4.8, 0.7, -3.5], size: [2.0, 1.3, 2.2], color: 0xf97316, desc: 'New coffee bar and quiet study corner.' },
        ]
      }
    };

    const id = new URLSearchParams(location.search).get('id') || 'cam9-t1';
    const mapCfg = MAPS[id] || MAPS['cam9-t1'];
    document.getElementById('map-title').textContent = mapCfg.title;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1220);
    const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 13, 14);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('canvas-wrap').appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.85));
    const dl = new THREE.DirectionalLight(0xffffff, 1.15); dl.position.set(8, 16, 10); scene.add(dl);

    const surround = new THREE.Mesh(new THREE.PlaneGeometry(34, 34), new THREE.MeshStandardMaterial({ color: mapCfg.surroundColor, roughness: 0.8 }));
    surround.rotation.x = -Math.PI / 2; surround.position.y = -0.1; scene.add(surround);
    const ground = new THREE.Mesh(new THREE.BoxGeometry(16, 0.2, 13), new THREE.MeshStandardMaterial({ color: mapCfg.groundColor, roughness: 0.7 }));
    ground.position.y = -0.05; scene.add(ground);

    function makeLabel(text, bg = '#0f172a') {
      const c = document.createElement('canvas'); c.width = 512; c.height = 96;
      const ctx = c.getContext('2d');
      ctx.fillStyle = bg; ctx.strokeStyle = '#475569'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.roundRect(8, 8, 496, 80, 20); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 28px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 256, 48);
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
      sp.scale.set(3.2, 0.6, 1);
      return sp;
    }

    // Compass N/S/E/W
    [['N', 0, -7.8], ['S', 0, 7.8], ['E', 9.2, 0], ['W', -9.2, 0]].forEach(([t, x, z]) => {
      const sp = makeLabel(t, '#1e293b'); sp.scale.set(1.3, 0.5, 1); sp.position.set(x, 0.5, z); scene.add(sp);
    });

    const activeGroup = new THREE.Group();
    scene.add(activeGroup);
    let clickable = [];

    function renderState(mode) {
      while (activeGroup.children.length) activeGroup.remove(activeGroup.children[0]);
      clickable = [];
      const items = mode === 'before' ? mapCfg.before : mapCfg.after;
      document.getElementById('btn-before').classList.toggle('active', mode === 'before');
      document.getElementById('btn-after').classList.toggle('active', mode === 'after');
      document.getElementById('state-badge').textContent = mode === 'before' ? mapCfg.beforeLabel : mapCfg.afterLabel;
      document.getElementById('item-title').textContent = mode === 'before' ? mapCfg.beforeLabel : mapCfg.afterLabel;
      document.getElementById('item-desc').textContent = 'Click any building or zone on the 3D map to inspect details.';
      document.getElementById('item-vocab').innerHTML = mapCfg.vocab;

      items.forEach(it => {
        const box = new THREE.Mesh(
          new THREE.BoxGeometry(...it.size),
          new THREE.MeshStandardMaterial({ color: it.color, roughness: 0.45 })
        );
        box.position.set(...it.pos);
        box.userData = it;
        activeGroup.add(box);
        clickable.push(box);

        const lbl = makeLabel(it.label);
        lbl.position.set(it.pos[0], it.pos[1] + it.size[1] / 2 + 0.7, it.pos[2]);
        activeGroup.add(lbl);
      });
    }

    document.getElementById('btn-before').onclick = () => renderState('before');
    document.getElementById('btn-after').onclick = () => renderState('after');

    const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
    window.addEventListener('click', (e) => {
      if (e.target.closest('button') || e.target.closest('.info-panel')) return;
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1; pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(clickable);
      if (hits.length) {
        const it = hits[0].object.userData;
        document.getElementById('item-title').textContent = it.label;
        document.getElementById('item-desc').textContent = it.desc;
      }
    });
    window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

    renderState('before');
    function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
    animate();
  </script>
</body>
</html>
